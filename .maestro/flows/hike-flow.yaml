appId: com.gzatrails.app
---
# Hike Flow
# Prerequisites: user is logged in, no hike is in progress, location permission granted.

- launchApp

# Navigate to first trail
- extendedWaitUntil:
    visible:
      id: "trail-card"
    timeout: 20000
- tapOn:
    index: 0
    id: "trail-card"

# Start hike
- tapOn: "Start Hike"

# A trail marked as closed asks for confirmation first
- tapOn:
    text: "Start anyway"
    optional: true

# Hike screen visible (the timer starts at 00:00:00)
- assertVisible: "00:00:.*"

# Pause hike
- tapOn: "Pause"
- assertVisible: "Resume"

# Resume hike
- tapOn: "Resume"
- assertVisible: "Pause"

# End hike (top-bar close button)
- tapOn:
    id: "close-button"

# Confirm end hike dialog
- tapOn: "End Hike"

# The hike screen is gone: the completion screen or the trail is shown
- extendedWaitUntil:
    notVisible: "Resume"
    timeout: 15000
- assertNotVisible: "Pause"
