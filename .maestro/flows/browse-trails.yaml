appId: com.gzatrails.app
---
# Browse Trails Flow
# Prerequisite: user is logged in

- launchApp

# Home screen loads with the trail list
- extendedWaitUntil:
    visible:
      id: "trail-card"
    timeout: 20000
- assertVisible: "Mikiri Trails"

# Open first trail card
- tapOn:
    id: "trail-card"
    index: 0

# Trail detail screen
- assertVisible: "Start Hike"
- scrollUntilVisible:
    element: "Upcoming Group Hikes"
    direction: DOWN

# Go back
- tapOn:
    id: "back-button"

# Switch to map view (just check nothing crashes)
- tapOn:
    id: "map-toggle"
- assertVisible: "Mikiri Trails"

# Switch back to list
- tapOn:
    id: "list-toggle"
- assertVisible:
    id: "trail-card"

# Search
- tapOn:
    id: "search-input"
- inputText: "Kazbegi"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "trail-card"
    timeout: 10000

# Clear the search again
- tapOn: "Clear search"
- assertVisible:
    id: "trail-card"

# Difficulty and region filters open in a bottom sheet
- tapOn:
    id: "filters-button"
- assertVisible: "Difficulty"
- tapOn: "Medium"
- tapOn: "Any"
- tapOn:
    id: "filters-show-results"
- assertVisible:
    id: "trail-card"
